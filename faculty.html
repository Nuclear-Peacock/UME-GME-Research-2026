<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Faculty Dashboard | Research Opportunities</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/faculty.mjs"></script>
</head>
<body>
  <main class="wrap faculty">
    <header class="hero faculty-hero">
      <h1>Faculty dashboard</h1>
      <a class="btn ghost" href="/">Learner opportunities</a>
    </header>
    <form id="login" class="form" method="post">
      <label>Faculty access token <input name="token" type="password" autocomplete="current-password" required></label>
      <button class="btn primary">Sign in</button>
    </form>
    <p id="notice" role="status"></p>
    <div id="dashboard" hidden>
      <section aria-labelledby="projectsHeading">
        <div class="faculty-toolbar">
          <h2 id="projectsHeading" tabindex="-1">Projects</h2>
          <div class="actions">
            <button class="btn" id="refresh">Refresh dashboard</button>
            <button class="btn ghost" id="logout">Sign out</button>
            <button class="btn primary" id="add" aria-controls="editor" aria-expanded="false">+ Add research</button>
          </div>
        </div>
        <div id="newProject">
          <form id="editor" class="form project-editor" method="post" aria-labelledby="editorHeading" hidden>
            <h3 id="editorHeading"></h3>
            <div class="editor-fields">
              <label>Title <input name="title" maxlength="200" required></label>
              <label>Status for learners <input name="status" maxlength="200" required></label>
              <label class="editor-wide">Card summary <textarea name="hook" maxlength="500" required></textarea></label>
              <label>Why it matters <textarea name="why" maxlength="3000" required></textarea>
              <label>What a student could do <textarea name="role" maxlength="3000" required></textarea>
              <label>Likely output <textarea name="output" maxlength="1500" required></textarea>
              <fieldset class="tracking-fields editor-wide">
                <legend>Recruitment and progress</legend>
                <label class="checkbox"><input name="signupOpen" type="checkbox" checked> Accept student interest</label>
                <label>Total spots <input name="capacity" type="number" min="0" step="1" placeholder="No limit"></label>
                <label>Confirmed spots <input name="confirmedSpots" type="number" min="0" step="1" value="0" required></label>
                <label>Project completion (%) <input name="completionPercent" type="number" min="0" max="100" step="1" value="0" required></label>
                <label class="checkbox"><input name="completed" type="checkbox"> Mark completed and hide from learners</label>
              </fieldset>
              <label>Timeline <input name="timeline" maxlength="500"></label>
              <label>Primary pathway <select name="accentKey" required></select></label>
              <fieldset id="pathways" class="editor-wide"><legend>Additional pathways</legend></fieldset>
              <label>Badges, one per line <textarea name="badges" maxlength="1815"></textarea></label>
              <label>Skills, one per line <textarea name="skills" maxlength="1815"></textarea></label>
            </div>
            <p id="editorNotice" class="editor-notice" role="status"></p>
            <div class="actions">
              <button class="btn primary">Save project</button>
              <button type="button" class="btn" id="cancel">Cancel</button>
            </div>
          </form>
        </div>
        <div id="projects" class="faculty-projects"></div>
      </section>
      <section aria-labelledby="interestsHeading">
        <h2 id="interestsHeading">Student interest</h2>
        <div id="interests"></div>
      </section>
    </div>
  </main>
</body>
</html>
